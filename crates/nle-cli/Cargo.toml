[package]
name = "nle-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The nle binary"

# Cargo would name the binary "nle-cli"; call it what it is.
[[bin]]
name = "nle"
path = "src/main.rs"

[features]
default = ["tui"]
# Interactive editor + mpv monitor. Off = a headless CLI that doesn't link
# the terminal stack (ratatui/crossterm and their transitive tree).
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
nle-core = { path = "../nle-core" }
nle-ffmpeg = { path = "../nle-ffmpeg" }
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
ratatui = { version = "0.30.2", optional = true }
crossterm = { version = "0.29.0", optional = true }
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true

[dev-dependencies]
# Sandboxes for the behaviour tests; already in the tree (nle-ffmpeg uses it).
tempfile.workspace = true
