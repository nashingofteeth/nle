# Workspace: one project, several crates — like npm workspaces / composer monorepo.
# Each crate is a separate package, but they build together and share config.
[workspace]
resolver = "2"
members = ["crates/nle-core", "crates/nle-ffmpeg", "crates/nle-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Dependencies declared ONCE here, referenced by crates as `name.workspace = true`.
# Same idea as a root package.json with shared deps.
[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-rational = "0.4"
tempfile = "3"

# Release = what you actually run. The heavy work (decode/encode/probe) happens
# in external ffmpeg/mpv processes and nle-core is pure timeline math, so full
# cross-crate LTO buys almost nothing at runtime — but it re-links the whole
# graph on every edit. "thin" LTO + parallel codegen keeps rebuilds ~3x faster.
# No `strip`: the installed binary keeps its symbol table so RUST_BACKTRACE=1
# crash backtraces still name functions (debug info is off by default here).
# The everyday build: no LTO. The hot work is in ffmpeg/mpv subprocesses, so
# cross-crate inlining buys almost nothing but costs ~2-3x on every rebuild.
[profile.release]
lto = false
codegen-units = 16

# Opt-in max-optimization build when you actually want one:
#   cargo build --profile release-lto
[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1

# Dev/testing: line-table debug info only (backtraces still resolve) instead of
# full DWARF — smaller target/, faster links. Incremental stays on.
[profile.dev]
debug = 1
